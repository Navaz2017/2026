# /etc/nginx/sites-available/enrolla.conf  — two names: example.org (website) and api.example.org (API).
# After `sudo certbot --nginx -d example.org -d api.example.org` certbot adds the HTTPS parts for you.
# If you use a Cloudflare Tunnel instead, point the tunnel at http://127.0.0.1:3000 and http://127.0.0.1:4000 and skip nginx.

server {
    listen 80;
    server_name example.org;
    client_max_body_size 5m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # OVERWRITE (not append) the client address so nobody can fake their IP to dodge rate limits
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.example.org;
    client_max_body_size 210m;          # campus videos are uploaded through the API (limit 200 MB)
    proxy_read_timeout 120s;
    proxy_request_buffering off;        # stream large uploads to disk instead of buffering twice
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
